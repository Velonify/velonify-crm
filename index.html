<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Link previews (WhatsApp, Slack, iMessage) need an absolute image URL. -->
    <meta property="og:title" content="Velonify" />
    <meta property="og:description" content="Interne Plattform von Velonify" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crm.velonify.de/" />
    <meta property="og:image" content="https://crm.velonify.de/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Krona+One&family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" />
    <title>Velonify</title>
    <script>
      // Theme before first paint, so dark-mode users see no white flash. Same rule as src/lib/useTheme.ts.
      try {
        var t = localStorage.getItem('velonify-crm.theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : t === 'dark' || t === 'espresso' || matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
